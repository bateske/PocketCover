<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Cover Scroller</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--dim:#8b949e;--accent:#e3b341}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Consolas,monospace}
  header{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid #30363d;padding:8px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  header h1{font-size:14px;margin:0}
  header label{color:var(--dim)}
  input,select{background:var(--bg);color:var(--ink);border:1px solid #30363d;border-radius:4px;padding:4px 6px;font:inherit}
  #grid{display:grid;grid-template-columns:repeat(var(--cols),max-content);gap:0 14px;padding:12px;width:max-content}
  .colhead{position:sticky;top:var(--head,46px);z-index:1;background:var(--bg);padding:6px 0;color:var(--accent);font-weight:bold;text-transform:uppercase}
  .cell{margin-bottom:12px;width:130px}
  canvas{display:block;width:128px;height:128px;image-rendering:pixelated;cursor:copy;border:1px solid #30363d}
  .tag{color:var(--ink)}.sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sentinel{height:1px}
  #toast{position:fixed;bottom:12px;right:12px;background:var(--accent);color:#000;padding:6px 10px;border-radius:4px;opacity:0;transition:opacity .2s}
  #zoom{position:fixed;pointer-events:none;z-index:5;display:none;border:2px solid var(--accent);background:#000;box-shadow:0 4px 16px #000a}
  #zoom canvas{width:256px;height:256px;border:0;cursor:default}
  #zoom div{padding:3px 6px;background:var(--panel)}
</style>
</head>
<body>
<header>
  <h1>Pocket Cover / infinite scroll</h1>
  <label>Title <input id="title" value="Pocket Worlds" maxlength="31"></label>
    <span style="color:var(--dim)">Each tile is labelled <b>style #variant</b>. Click a tile to copy its reference.</span>
</header>
<div id="grid"></div>
<div id="sentinel"></div>
<div id="toast"></div>
<div id="zoom"><canvas width="128" height="128"></canvas><div></div></div>
<script type="module" src="scroll.js"></script>
</body>
</html>
