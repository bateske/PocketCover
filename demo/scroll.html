<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Cover Scroller</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body class="scroller">
<header>
  <h1>Pocket Cover / infinite scroll</h1>

<div id="grid"></div>
<div id="sentinel"></div>
<div id="toast"></div>
<script type="module" src="scroll.js"></script>
</body>
</html>
